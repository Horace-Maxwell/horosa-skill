<title id="title">Horosa Skill architecture</title>
<desc id="desc">Four layers: AI clients reach the local Horosa Skill process over MCP or the CLI; it gates, dispatches and documents each call, computes on the offline runtime (Java backend, Python chart service, Node headless JS) and stores every run locally.</desc>
