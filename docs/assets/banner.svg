<svg viewBox="0 0 1280 380" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1728"/><stop offset="55%" stop-color="#0b1120"/><stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="tealb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="goldb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f7d774"/><stop offset="1" stop-color="#e0a93b"/></linearGradient>
    <radialGradient id="orb" cx="42%" cy="38%" r="65%"><stop offset="0" stop-color="#c4b5fd"/><stop offset="55%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#5b21b6"/></radialGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1280" height="380" rx="18" fill="url(#bgb)"/>

  <!-- astrolabe motif on the left -->
  <g transform="translate(210,190)">
    <g stroke="#2dd4bf" fill="none" opacity="0.22" stroke-width="1.3">
      <circle r="150"/><circle r="120"/><circle r="88"/>
    </g>
    <circle r="135" fill="none" stroke="#e0a93b" opacity="0.28" stroke-width="1" stroke-dasharray="2 12"/>
    <g stroke="#2dd4bf" opacity="0.14" stroke-width="1">
      <line x1="0" y1="-150" x2="0" y2="150"/><line x1="-150" y1="0" x2="150" y2="0"/>
      <line x1="-106" y1="-106" x2="106" y2="106"/><line x1="106" y1="-106" x2="-106" y2="106"/>
    </g>
    <!-- crystal orb -->
    <circle r="52" fill="none" stroke="url(#tealb)" stroke-width="2.4" filter="url(#gl)"/>
    <circle cx="0" cy="-4" r="40" fill="url(#orb)"/>
    <ellipse cx="-12" cy="-18" rx="13" ry="8" fill="#ffffff" opacity="0.45"/>
    <path d="M -26 40 L 26 40 L 20 54 L -20 54 Z" fill="url(#goldb)"/>
    <g fill="#fff" opacity="0.9"><circle cx="8" cy="6" r="1.6"/><circle cx="-6" cy="14" r="1.3"/><circle cx="16" cy="-8" r="1.3"/></g>
  </g>
  <g fill="#e8edf7" opacity="0.7"><circle cx="120" cy="60" r="2"/><circle cx="360" cy="300" r="1.8"/><circle cx="60" cy="300" r="1.5"/></g>

  <!-- text block -->
  <text x="440" y="150" font-size="72" font-weight="800" fill="#f4f7ff" letter-spacing="0.5">Horosa Skill</text>
  <text x="444" y="196" font-size="26" font-weight="600" fill="url(#tealb)" letter-spacing="2">星阙 · LOCAL-FIRST · MCP</text>
  <text x="444" y="250" font-size="30" font-weight="600" fill="#cdd6ea">把星阙 93 个术数 / 占星技法，做成任何 AI 都能</text>
  <text x="444" y="290" font-size="30" font-weight="600" fill="#cdd6ea"><tspan fill="url(#goldb)" font-weight="800">本地调用</tspan>的 MCP server 与 CLI。</text>

  <!-- stat chips -->
  <g font-weight="700">
    <rect x="444" y="316" width="118" height="42" rx="11" fill="rgba(45,212,191,.12)" stroke="#2dd4bf" stroke-opacity="0.4"/>
    <text x="503" y="343" font-size="20" text-anchor="middle" fill="#5eead4">93 技法</text>
    <rect x="574" y="316" width="128" height="42" rx="11" fill="rgba(224,169,59,.12)" stroke="#e0a93b" stroke-opacity="0.4"/>
    <text x="638" y="343" font-size="20" text-anchor="middle" fill="#f7d774">本地离线</text>
    <rect x="714" y="316" width="150" height="42" rx="11" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.14)"/>
    <text x="789" y="343" font-size="20" text-anchor="middle" fill="#e8edf7">372 tests ✓</text>
    <rect x="876" y="316" width="150" height="42" rx="11" fill="rgba(167,139,250,.12)" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="951" y="343" font-size="20" text-anchor="middle" fill="#c4b5fd">AGPL-3.0</text>
  </g>
</svg>
