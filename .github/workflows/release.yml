name: Release Runtime

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  build-release:
    # Owner guard: forks pushing v* tags must not queue jobs against the maintainer's
    # self-hosted runner (also avoids 24h phantom queued runs on forks).
    if: github.repository_owner == 'Horace-Maxwell'
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build_runtime_release.sh runs `npm install --omit=dev` in horosa-core-js to bundle
      # lunar-javascript (needed by canping/heluo) into the runtime payload — so node/npm must be on
      # PATH even on a self-hosted runner.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: ./horosa-skill
        run: uv sync --dev
      # 发布链是唯一同时持有上游 checkout 与 vendored 树的地方——跨树校验只能在这里做真。
      # 没有这两闸，vendored 树落后于上游时全流水线依旧全绿（v48 vs v50 就是这么漏过去的）。
      - name: Verify vendored trees match upstream HEAD (contract version + sentinels + core-js)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_upstream_sync.py --require-upstream --write-state
      - name: Verify export-section debt against upstream (ratchet)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_export_section_baseline.py --source upstream --require-upstream
      - name: Verify vendored runtime inputs
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_vendor_runtime_sources.py
      - name: Verify export-contract mirror (skill registry ↔ vendored aiExport version + keys)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_export_contract_mirror.py
      - name: Verify bundled knowledge index
        working-directory: ./horosa-skill
        run: uv run python scripts/build_knowledge_index.py --check
      - name: Build runtime archives and manifest
        working-directory: ./horosa-skill
        run: bash scripts/build_runtime_release.sh
      - name: Generate SBOM
        working-directory: ./horosa-skill
        run: uv run python scripts/generate_sbom.py --project-root . --runtime-manifest dist/runtime/runtime-manifest.json --output dist/runtime/horosa-skill-sbom.json
      - name: Upload runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: horosa-runtime-release
          path: |
            horosa-skill/dist/runtime/*.tar.gz
            horosa-skill/dist/runtime/*.zip
            horosa-skill/dist/runtime/runtime-manifest.json
            horosa-skill/dist/runtime/SHA256SUMS.txt
            horosa-skill/dist/runtime/horosa-skill-sbom.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            horosa-skill/dist/runtime/*.tar.gz
            horosa-skill/dist/runtime/*.zip
            horosa-skill/dist/runtime/runtime-manifest.json
            horosa-skill/dist/runtime/SHA256SUMS.txt
            horosa-skill/dist/runtime/horosa-skill-sbom.json
