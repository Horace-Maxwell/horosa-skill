name: runtime-matrix

# v0.38.0 A5: real-machine proof that an installed runtime works — on the three hosts a release claims to
# support: Apple Silicon (darwin-arm64), Windows x64, and Windows on ARM (which installs the win32-x64 payload
# under emulation). Each lane installs (a REAL https download in release/schedule mode) → doctor → starts the runtime
# under the FACTORY budget → calls chart / qimen / nongli_time / bazi_birth → runs `setup --client …` for all nine clients
# (config → re-read → real stdio probe) → claude-code user scope → streamable-http handshake (Bearer / 401 / 421) →
# stop refused while a second stdio client is attached → restart + HOROSA_PORTS=auto → the live pytest suite → stops.
# A chart-only degrade (dead Java backend) fails the lane.
#
# Never on push / pull_request (a runtime boot per push would be minutes of hosted-runner time for nothing):
# `workflow_call` from release-runtime.yml (installing from the assembled artifact, before anything is public),
# manual dispatch against a published release, and a weekly run against the public latest.
# The ARM lane is BLOCKING by default since dry run #4 (2026-09-11, run 34568103210) proved windows-11-arm installs the
# win32-x64 payload under emulation and passes the whole lane (live pytest 1025 passed); `arm_nonblocking=true` is the
# escape hatch for a known-flaky day, never the default (AGENTS.md §7).

on:
  workflow_call:
    inputs:
      source:
        description: "artifact (assembled by release-runtime.yml) or release (download assets from a GitHub release)"
        type: string
        required: true
      artifact_name:
        type: string
        default: runtime-release-assets
      tag:
        description: "release mode: tag to test (empty = public latest)"
        type: string
        default: ""
      arm_nonblocking:
        type: boolean
        default: false
      skip_pytest:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (empty = public latest)"
        type: string
        default: ""
      arm_nonblocking:
        type: boolean
        default: false
      skip_pytest:
        type: boolean
        default: false
  schedule:
    # v0.38.1 R2: off the hour — GitHub delays/drops on-the-hour slots (the 03:00 slot fired 5.5 h late on 2026-09-14);
    # release-completeness.yml's weekly-matrix-kick job dispatches this workflow when a week passes without a run.
    - cron: "23 4 * * 1" # weekly, Monday 04:23 UTC, against the public latest (a REAL https download, R1)

permissions:
  contents: read

jobs:
  lane:
    if: github.repository_owner == 'Horace-Maxwell'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            platform: darwin-arm64
            expect_payload: darwin-arm64
            emulated: false
            python_arch: arm64
          - runner: windows-latest
            platform: win32-x64
            expect_payload: win32-x64
            emulated: false
            python_arch: x64
          - runner: windows-11-arm
            platform: win32-arm64
            expect_payload: win32-x64
            emulated: true
            # x64 CPython on the ARM64 host: every dependency has x64 wheels, and the skill then runs exactly the
            # way a user with an x64 Python does (PROCESSOR_ARCHITEW6432 → win32-arm64 → win32-x64 payload).
            python_arch: x64
    runs-on: ${{ matrix.runner }}
    # the ARM lane blocks like the others; arm_nonblocking=true (explicit) makes it advisory for one run
    continue-on-error: ${{ matrix.platform == 'win32-arm64' && inputs.arm_nonblocking == true }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      HOROSA_RUNTIME_START_TIMEOUT_SECONDS: "900"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_arch }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install horosa-core-js deps (lunar-javascript)
        working-directory: ./horosa-skill/horosa-core-js
        run: npm ci --omit=dev
      - name: Install dependencies (the interpreter setup-python provided, so the ARM lane really runs x64)
        working-directory: ./horosa-skill
        env:
          UV_PYTHON: ${{ steps.py.outputs.python-path }}
        run: uv sync --dev
      - name: Download assembled assets (artifact mode)
        if: ${{ inputs.source == 'artifact' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ runner.temp }}/horosa-assets
      # v0.38.1 R1: release / dispatch / schedule lanes install through the PUBLIC manifest URL — the installer's own
      # `_download_with_resume` (mirror chain → resume → sha256 → unpack), i.e. exactly what a user runs. Before this the
      # lane pre-downloaded with `gh release download` and localised the manifest to file://, so no lane had ever exercised
      # the download path (the 2026-09-14 schedule run's lane-report still says `--manifest-url file://…lane-manifest.json`).
      - name: Resolve the install source (artifact dir, or the release manifest URL)
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.source }}" = "artifact" ]; then
            echo "mode=assets-dir" >> "${GITHUB_OUTPUT}"
            echo "value=${RUNNER_TEMP}/horosa-assets" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          TAG="${{ inputs.tag }}"
          if [ -z "${TAG}" ]; then
            TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName -q .tagName)"
          fi
          echo "testing release ${TAG} through its public manifest URL (real download)"
          echo "mode=manifest-url" >> "${GITHUB_OUTPUT}"
          echo "value=https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/runtime-manifest.json" >> "${GITHUB_OUTPUT}"
      # v0.38.1 R10: the lane's work dir carries a space AND CJK on purpose — every quoted path argument, the launchers'
      # UTF-8 console encoding (A1) and the `claude mcp add` command quoting (A4) are exercised on a real machine.
      - name: Live verification (POSIX)
        if: runner.os != 'Windows'
        working-directory: ./horosa-skill
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/verify_runtime_live.py \
            "--${{ steps.source.outputs.mode }}" "${{ steps.source.outputs.value }}" \
            --work-dir "${RUNNER_TEMP}/horosa 测试 lane" \
            --expect-payload-platform "${{ matrix.expect_payload }}" \
            ${{ matrix.emulated && '--expect-emulated' || '' }} \
            ${{ inputs.skip_pytest && '--skip-pytest' || '' }} \
            --out "${RUNNER_TEMP}/horosa 测试 lane/lane-report.json"
      - name: Live verification (Windows)
        if: runner.os == 'Windows'
        working-directory: ./horosa-skill
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $extra = @()
          if ('${{ matrix.emulated }}' -eq 'true') { $extra += '--expect-emulated' }
          if ('${{ inputs.skip_pytest }}' -eq 'true') { $extra += '--skip-pytest' }
          $lane = Join-Path $env:RUNNER_TEMP 'horosa 测试 lane'
          # v0.38.1: on Windows the RUNTIME ROOT must be ASCII-only. Proven on these runners in three draft runs: under
          # "horosa 测试 lane" the bundled JDK 17 java.exe failed ("Unable to access jarfile ...??..." then "could not find
          # java.dll": GetCommandLineA / GetModuleFileNameA); under "horosa lane é" Java started but Swiss Ephemeris could not
          # open its files (pyswisseph hands a UTF-8 path to C fopen, which Windows decodes as ANSI) -> KeyError 'Chiron'.
          # install now refuses non-ASCII roots (runtime.path_not_ascii; the lane's non_ascii_root_refusal step proves it here).
          # CJK stays in the work dir (data dir, client configs, logs); the runtime root keeps its spaces.
          $runtimeRoot = Join-Path $env:RUNNER_TEMP 'horosa lane runtime'
          uv run python scripts/verify_runtime_live.py "--${{ steps.source.outputs.mode }}" "${{ steps.source.outputs.value }}" --work-dir "$lane" --runtime-root "$runtimeRoot" --expect-payload-platform "${{ matrix.expect_payload }}" @extra --out "$lane\lane-report.json"
      - name: Upload lane evidence (report, doctor snapshots, launcher + service logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-matrix-${{ matrix.platform }}
          if-no-files-found: ignore
          # one root only: mixing runner.temp with `~` made upload-artifact on Windows refuse the whole set
          # ("rootDirectory … is not a parent directory"); the verifier copies service logs into <lane>/logs itself.
          path: |
            ${{ runner.temp }}/horosa 测试 lane/*.json
            ${{ runner.temp }}/horosa 测试 lane/pytest.log
            ${{ runner.temp }}/horosa 测试 lane/http-serve.log
            ${{ runner.temp }}/horosa 测试 lane/logs/**
