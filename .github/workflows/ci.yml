name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # canping/heluo compute their four pillars in-process via horosa-core-js's vendored bazi chain,
      # which imports the `lunar-javascript` npm package. node_modules is gitignored, so a fresh CI
      # checkout must install it or the (non-runtime-gated) canping/heluo tests fail with
      # ERR_MODULE_NOT_FOUND. Mirrors the runtime builders' `npm install --omit=dev`.
      - name: Install horosa-core-js deps (lunar-javascript)
        working-directory: ./horosa-skill/horosa-core-js
        run: npm ci --omit=dev
      - name: Run horosa-core-js JS golden self-check (horary/election/balbillus)
        working-directory: ./horosa-skill/horosa-core-js
        run: npm test
      - name: Install dependencies
        working-directory: ./horosa-skill
        run: uv sync --dev
      - name: Run unit tests
        working-directory: ./horosa-skill
        run: uv run pytest -q
      - name: Verify README links
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_readme_links.py
      - name: Verify server.json
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_server_json.py
      - name: Verify docs sync (version lockstep / tool coverage / links / frontmatter)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_docs_sync.py
      # ⚠️ 这两个 step 在 GitHub runner 上**做不了本行的核心比对**：`vendor/runtime-source` 是
      # gitignored、也没有上游 checkout。以前注释声称棘轮「在这里就能红」，实际是整段 skip，
      # 于是两个守卫在 CI 里零断言（2026-08 连同 release.yml 从未执行一并发现）。
      # 现在各自退而断言仓内可判的部分：基线键 vs registry 自洽 / state 文件是否已落后于镜像常量。
      # 真正的跨树比对是维护机上的 pre-tag 步骤：scripts/preflight_release.py（AGENTS §7）。
      - name: Verify export-section baseline coherence (section diff needs a vendored tree)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_export_section_baseline.py
      - name: Verify upstream-sync state currency (cross-tree diff needs an upstream checkout)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_upstream_sync.py
      - name: Verify technique compute-source declarations
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_technique_provenance.py
      - name: Verify MCP advertised schemas are portable across clients
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_mcp_client_compat.py
      - name: Verify runtime launcher never kills foreign processes
        working-directory: ./horosa-skill
        run: |
          uv run python scripts/verify_runtime_scripts.py
          uv run python scripts/verify_runtime_scripts.py --self-test
      - name: Verify committed client configs actually connect (.mcp.json / plugin)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_client_configs.py
      - name: Verify MCPB bundle manifest and contents
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_mcpb_manifest.py
      - name: Zero-install path works (uvx --from git+…#subdirectory)
        # 🔴 `#subdirectory=` 是 README 与 server.json 里给用户的唯一零安装命令（PyPI 未开通）。
        # 用 file:// 指向本 checkout：不上网、不依赖 tag 已推送，但把「subdirectory 语法解析得对吗」
        # 这一条真的跑一遍 —— 写错时的症状是用户端一句 `Distribution not found`。
        # 🔴 URL 里必须钉一个 rev。actions/checkout 的工作树没有 `refs/remotes/origin/HEAD`，
        # uv 解析 file:// 仓库的默认分支时会 `git rev-parse refs/remotes/origin/HEAD` 失败
        # （CI 实测：`failed to find default branch HEAD`）。钉 SHA 同时也更贴近用户拿到的
        # `@v<tag>` 形式 —— 那一条本来就带 rev。
        run: HOME=$(mktemp -d) uvx --from "git+file://$GITHUB_WORKSPACE@$GITHUB_SHA#subdirectory=horosa-skill" horosa-skill --version
      - name: Zero-install path from the wheel works (uvx --from <wheel>)
        # v0.38.0 B3：发布页附带的纯 Python wheel 是免 git / 免 PyPI 的零安装通路。这里用本 checkout 构建的
        # wheel 走 file:// 把「uvx 能从一个 .whl URL 起 horosa-skill」这条真跑一遍；线上 URL 由
        # release-completeness.yml 对已发布的 latest 断言。
        run: |
          set -euo pipefail
          rm -rf /tmp/horosa-whl && mkdir -p /tmp/horosa-whl
          (cd horosa-skill && uv build --wheel --out-dir /tmp/horosa-whl)
          whl="$(ls /tmp/horosa-whl/horosa_skill-*-py3-none-any.whl)"
          HOME=$(mktemp -d) uvx --from "file://${whl}" horosa-skill --version
          # v0.38.0 B4：wheel 装出来的包旁边没有 pyproject.toml —— `setup` 必须自动选 uvx-wheel 启动器（而不是 BadParameter），
          # dry-run 走完七步、零副作用。
          HOME=$(mktemp -d) uvx --from "file://${whl}" horosa-skill setup --client cursor --config /tmp/horosa-setup-smoke/mcp.json --dry-run --no-probe-network \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["launcher"]["kind"] == "uvx-wheel", r["launcher"]; print("setup dry-run via wheel:", r["summary"])'
      - name: Verify JS tool→engine boundary contracts (the issue #15 dead-key shape)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_js_boundary_contracts.py
      - name: Verify value-level golden coverage (presence-level assertions are blind to values)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_value_goldens.py
      - name: Verify silent-empty-return ratchet
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_silent_returns.py
      - name: Verify silent-degrade ratchet (a bare logger.warning tells the log, not the caller)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_silent_degrades.py
      - name: Verify MCP tools/list byte budget (advertised-layer schema ratchet)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_mcp_list_budget.py
      - name: Verify dispatch router corpus (zh+en queries → expected tools; min_pass only goes up)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_router_corpus.py
      - name: Verify error-code recovery (every code classifies; bilingual messages only increase)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_error_recovery.py
      - name: Verify wheel contents (what `uvx horosa-skill` will actually install)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_wheel_contents.py
      - name: Verify every schema knob has a consumer
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_schema_knob_wiring.py
      - name: Verify the seed-derived runtime Python lock (dep set is a pure function of the seed)
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_runtime_python_lock.py
      - name: Verify macOS/Windows runtime-builder parity
        working-directory: ./horosa-skill
        run: uv run python scripts/verify_builder_parity.py
      - name: Verify bundled knowledge index
        working-directory: ./horosa-skill
        run: uv run python scripts/build_knowledge_index.py --check
      - name: Run HorosaBench local-only smoke
        working-directory: ./horosa-skill
        run: uv run python scripts/run_benchmark.py --skip-runtime

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # See the test job: canping/heluo need horosa-core-js's lunar-javascript dep (node_modules is
      # gitignored). `npm ci` is cross-platform; setup-node provides npm on the Windows runner too.
      - name: Install horosa-core-js deps (lunar-javascript)
        working-directory: ./horosa-skill/horosa-core-js
        run: npm ci --omit=dev
      - name: Run horosa-core-js JS golden self-check (horary/election/balbillus)
        working-directory: ./horosa-skill/horosa-core-js
        run: npm test
      - name: Install dependencies
        working-directory: ./horosa-skill
        run: uv sync --dev
      - name: Run unit tests
        working-directory: ./horosa-skill
        run: uv run pytest -q
      - name: Run Windows OpenClaw smoke
        timeout-minutes: 35
        working-directory: ./horosa-skill
        run: |
          # pwsh 多行 step 只把**最后一条**命令的退出码当 step 结果；开了这个开关，任何原生命令非零即失败
          # （tests/test_ci_workflow_shape.py 守；v0.38.0 前 `tool run --output` 这个不存在的参数在这里安静失败了 N 轮）。
          $PSNativeCommandUseErrorActionPreference = $true
          $root = Join-Path $env:RUNNER_TEMP 'horosa-openclaw'
          if (Test-Path $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          $workspace = Join-Path $root 'workspace'
          $config = Join-Path $workspace 'config\mcporter.json'
          $manualHome = Join-Path $root 'manual-home'
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          uv run horosa-skill client openclaw-config --format mcporter --isolate-home $manualHome --write $config
          uv run horosa-skill client openclaw-setup --workspace $workspace
          uv run horosa-skill client openclaw-check --workspace $workspace
          $configJson = Get-Content -Raw -LiteralPath $config | ConvertFrom-Json
          $serverEnv = $configJson.mcpServers.horosa.env
          foreach ($entry in $serverEnv.PSObject.Properties) {
            Set-Item -Path "Env:$($entry.Name)" -Value ([string]$entry.Value)
          }
          '{"date":"2028-04-06","time":"09:33:00","zone":"+08:00","lat":"31n13","lon":"121e28","gpsLat":31.2167,"gpsLon":121.4667}' | uv run horosa-skill tool run qimen --stdin --output "$root\qimen-smoke.json"
          if (-not (Test-Path -LiteralPath "$root\qimen-smoke.json")) { throw "qimen smoke wrote no --output file" }
          $smoke = Get-Content -Raw -LiteralPath "$root\qimen-smoke.json" | ConvertFrom-Json
          if (-not $smoke.ok) { throw "qimen smoke returned ok=false: $($smoke.error | ConvertTo-Json -Compress)" }
          uv run horosa-skill memory query --tool qimen --limit 1
          # v0.38.0 B4：`setup` 在 Windows 真机上写配置 → 回读体检 → 用客户端将要执行的命令真起一次 stdio server（cursor = 11 个工具）
          uv run horosa-skill setup --client cursor --config "$root\cursor-mcp.json" --skip-install --no-probe-network > "$root\setup-cursor.json"
          if (-not (Test-Path -LiteralPath "$root\cursor-mcp.json")) { throw "setup wrote no cursor config" }
          $setupReport = Get-Content -Raw -LiteralPath "$root\setup-cursor.json" | ConvertFrom-Json
          if (-not $setupReport.ok) { throw "setup returned ok=false: $($setupReport.summary)" }
          if ($setupReport.steps.stdio_probe.tools -ne 11) { throw "stdio probe listed $($setupReport.steps.stdio_probe.tools) tools, expected 11" }
          # v0.38.0 B5：codex 形状 TOML 生成 → 回读体检（client check）→ tomllib 断言超时字段在场、command 是绝对路径
          uv run horosa-skill client config --format codex --write "$root\codex-config.toml" > $null
          uv run horosa-skill client check --client codex --config "$root\codex-config.toml" > "$root\codex-check.json"
          $codexCheck = Get-Content -Raw -LiteralPath "$root\codex-check.json" | ConvertFrom-Json
          if (-not $codexCheck.ok) { throw "codex client check found problems: $($codexCheck.summary)" }
          uv run python -c 'import sys, tomllib; s = tomllib.load(open(sys.argv[1], "rb"))["mcp_servers"]["horosa"]; assert s["startup_timeout_sec"] == 120 and s["tool_timeout_sec"] == 600, s; assert ":" in s["command"] and s["command"].lower().endswith("uv.exe"), s["command"]; print("codex toml ok:", s["command"])' "$root\codex-config.toml"
