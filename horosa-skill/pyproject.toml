[project]
name = "horosa-skill"
version = "0.35.0"
description = "GitHub-first Horosa AI skill distribution with CLI, MCP, and local structured memory."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45.0.0",
  "httpx>=0.28.0",
  # 钉在 1.x：SDK v2.0.0（2026-07-28）是破坏性重写（FastMCP→MCPServer、装饰器→构造器、
  # camelCase→snake_case、httpx2、强制 opentelemetry）。v2 同时支持 2026-07-28 与更早修订，
  # 故晚迁不掉队；迁移单独跟踪，不随本版本走。
  "mcp[cli]>=1.28.1,<2",
  "pydantic>=2.8.0",
  "python-docx>=1.1.2",
  "reportlab>=4.2.0",
  # codex config.toml 的保注释合并（client config --write --format codex 只动 [mcp_servers.<name>]）
  "tomlkit>=0.12.0",
  "tzdata>=2025.2",
  "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
horosa-skill = "horosa_skill.surfaces.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/horosa_skill"]
include = [
  "src/horosa_skill/knowledge/data/*.json",
  "src/horosa_skill/benchmark/data/*.json",
  "src/horosa_skill/data/*.json",
]

# Windows 启动/停止脚本覆盖模板（issue #14 loopback 修补）住在 scripts/ 供 builder 共用；wheel 里没有
# scripts/ → `uvx horosa-skill` 装出来的 Windows 用户会跑 runtime 原版脚本。force-include 进包，
# manager._runtime_template_root 先找包内副本再回退源码树（v0.36.0 C4；scripts/verify_wheel_contents.py 守）。
[tool.hatch.build.targets.wheel.force-include]
"scripts/runtime_templates/windows" = "horosa_skill/runtime/templates/windows"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
