services:
  horosa-skill:
    build: .
    ports:
      - "8765:8765"
    environment:
      HOROSA_SERVER_ROOT: ${HOROSA_SERVER_ROOT:-http://host.docker.internal:9999}
      # 🔴 两个 ROOT 都要给：只设 Java 后端那条时 chart 族（西占 chart / 三式 ken / 神数 …）会在容器里找 127.0.0.1:8899 → 全部失败。
      HOROSA_CHART_SERVER_ROOT: ${HOROSA_CHART_SERVER_ROOT:-http://host.docker.internal:8899}
      HOROSA_SKILL_HOST: 0.0.0.0
      HOROSA_SKILL_PORT: 8765
      # 绑 0.0.0.0 必须给令牌（否则 serve 拒绝启动）。生成一个：
      #   python3 -c "import secrets;print(secrets.token_urlsafe(24))"
      HOROSA_MCP_TOKEN: ${HOROSA_MCP_TOKEN:?set HOROSA_MCP_TOKEN before `docker compose up`}
      # Host 白名单的追加项（逗号分隔 name:*）。容器里绑的是 0.0.0.0：宿主经端口映射用 localhost:8765 来连、容器里的
      # 客户端用 host.docker.internal 来连，这两种默认已放行；别的机器用宿主的局域网 IP / 主机名来连时，把它加在这里，
      # 否则 421（启动横幅与 421 回包都会印出要加的那一行）。
      HOROSA_MCP_ALLOWED_HOSTS: ${HOROSA_MCP_ALLOWED_HOSTS:-host.docker.internal:8765}
    volumes:
      - horosa_skill_data:/root/.horosa-skill

volumes:
  horosa_skill_data:

